<div class="theme-showcase__wrapper theme-${config.cssName}">
	<header class="theme-showcase__header">
		<h2 class="theme-showcase__title">${config.title}</h2>
		<p data-optional class="theme-showcase__subtitle">${config.subtitle}</p>
	</header>

	<section class="theme-showcase__colors" aria-labelledby="theme-showcase-colors">
		<div class="theme-showcase__section-head">
			<h3 id="theme-showcase-colors" class="theme-showcase__section-label">Colors</h3>
			<div data-component="copy-theme-button"></div>
		</div>
		<div class="theme-showcase__color-groups">${renderColorGroups(config)}</div>
	</section>

	<section class="theme-showcase__narration" data-optional="${config.pitch || null}" aria-labelledby="theme-showcase-narration">
		<h3 id="theme-showcase-narration" class="theme-showcase__section-label">Narration</h3>
		<p class="theme-showcase__pitch">${config.pitch}</p>
	</section>

	<section aria-labelledby="theme-showcase-fonts">
		<h3 id="theme-showcase-fonts" class="theme-showcase__section-label">Fonts</h3>
		<div class="theme-showcase__fonts-grid">
			<div class="theme-showcase__fonts-primary">
				<h4>Primary: ${config.fonts.primary.name}</h4>
				<p data-optional="${config.fonts.primary.pitch}">${config.fonts.primary.pitch}</p>
			</div>
			<div class="theme-showcase__fonts-secondary">
				<h4>Secondary: ${config.fonts.secondary.name}</h4>
				<p data-optional="${config.fonts.secondary.pitch}">${config.fonts.secondary.pitch}</p>
			</div>
		</div>
	</section>
</div>
